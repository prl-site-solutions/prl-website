# Refreshes the careers page and /jobs/ pages from PRL's live CV-Library adverts twice a day,
# then tells Google (Indexing API) which job pages were added, changed or removed.
# Can also be run by hand: GitHub -> Actions -> "Sync jobs from CV-Library" -> Run workflow.
name: Sync jobs from CV-Library

on:
  schedule:
    - cron: '17 5 * * *'
    - cron: '17 12 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: sync-jobs
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rebuild careers.html and job pages from CV-Library
        env:
          INDEXING_DEFER: '1'
          INDEXING_CHANGES_FILE: ${{ runner.temp }}/indexing-changes.json
        run: node scripts/sync-jobs.mjs

      - name: Commit and publish if the jobs changed
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "Jobs unchanged — nothing to publish."
            exit 0
          fi
          git config user.name "prl-job-sync"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A careers.html sitemap.xml jobs
          git commit -m "chore(careers): daily job sync from CV-Library"
          git push
          echo "published=true" >> "$GITHUB_OUTPUT"
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages build request failed — the push may still trigger one."

      - name: Tell Google about new, changed and closed jobs
        if: steps.publish.outputs.published == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GOOGLE_INDEXING_KEY: ${{ secrets.GOOGLE_INDEXING_KEY }}
        run: |
          sha="$(git rev-parse HEAD)"
          for i in $(seq 1 40); do
            build="$(gh api "repos/${{ github.repository }}/pages/builds/latest" --jq '.status + " " + .commit' || true)"
            [ "$build" = "built $sha" ] && break
            sleep 15
          done
          echo "Pages: $build"
          node scripts/notify-indexing.mjs --changes "${{ runner.temp }}/indexing-changes.json"
